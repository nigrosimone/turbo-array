name: Release

# Publishes to npm when a version tag is pushed. The local half of the flow is
# `npm run release` (release-it), which bumps the version, writes the CHANGELOG,
# commits and tags; pushing that tag is what triggers this workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required by npm trusted publishing: npm exchanges this short lived OIDC
  # token for a publish credential, so no NPM_TOKEN secret is needed.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # Builds, lints, type checks and runs the suite. The build output is what
      # gets published, so this has to succeed before publishing.
      - run: npm test

      - name: Publish
        run: npm publish --provenance
