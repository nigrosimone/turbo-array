name: Release

# Publishes to npm when a version tag is pushed. The local half of the flow is
# `npm run release` (release-it), which bumps the version, writes the CHANGELOG,
# commits and tags; pushing that tag is what triggers this workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required by npm trusted publishing: npm exchanges this short lived OIDC
  # token for a publish credential, so no NPM_TOKEN secret is needed.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Runs before anything expensive: a manual dispatch carries no tag, so without
      # this the run builds and tests everything only to die on the last step, when
      # npm refuses to overwrite a published version.
      - name: Check the version is releasable
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # a tag push names the release, so the tag and the manifest have to agree
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm: cut a new version with \`npm run release\`"
            exit 1
          fi
          echo "Releasing $name v$version"

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      - run: npm ci

      # Builds, lints, type checks and runs the suite. The build output is what
      # gets published, so this has to succeed before publishing.
      - run: npm test

      - name: Publish
        run: npm publish --provenance
